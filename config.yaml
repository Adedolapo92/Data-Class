# ── LinkedIn keyword searches ──────────────────
# Searches run for every keyword × every location combination.
# Keep the list focused — each combo is a separate HTTP request.
linkedin_searches:
  keywords:
    # ── General tech / platform ───────────────────────────────────────────────
    - "Senior Product Manager cloud infrastructure"
    - "Staff Product Manager AI ML platform"
    - "Principal Product Manager B2B SaaS"
    - "Senior Technical Program Manager cloud"
    - "Group Product Manager enterprise"

    # ── Austin tech ───────────────────────────────────────────────────────────
    - "Senior Product Manager Austin Texas tech"
    - "Staff Product Manager Austin Texas remote"
    - "Technical Program Manager Austin Texas"

    # ── Healthcare / digital health ───────────────────────────────────────────
    - "Senior Product Manager digital health remote"
    - "Senior Product Manager healthtech telehealth"
    - "Staff Product Manager healthcare platform"
    - "Senior Product Manager health Austin Texas"

    # ── Fintech ───────────────────────────────────────────────────────────────
    - "Senior Product Manager fintech payments remote"
    - "Staff Product Manager fintech platform"
    - "Senior Product Manager financial technology Austin"

  locations:
    - "United States"
    - "Austin, Texas"

  # f_WT=2 → remote only. Set to false to also see on-site Austin roles.
  remote_filter: true

# ── Title matching ─────────────────────────────
keywords:
  title_include:
    - "Senior Product Manager"
    - "Senior PM"
    - "Staff Product Manager"
    - "Staff PM"
    - "Principal Product Manager"
    - "Principal PM"
    - "Senior Technical Program Manager"
