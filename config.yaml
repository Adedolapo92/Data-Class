# ── Location preferences ───────────────────────
locations:
  # Roles matching these strings are considered "preferred"
  preferred:
    - Remote
    - remote
    - Austin
    - austin

  # These are included but flagged "relocation required"
  flag_relocation:
    - New York
    - NYC
    - San Francisco
    - SF
    - Seattle

# ── Compensation filter ────────────────────────
compensation:
  minimum_max_salary: 150000   # include only if listed max >= this; include unknowns too

# ── Email / SMTP ───────────────────────────────
email:
  smtp_host: smtp.gmail.com
  smtp_port: 587
  use_tls: true
